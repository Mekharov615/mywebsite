<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Услуги & Новости — Админ-панель</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0E0A14;
      --bg2: #1C1024;
      --bg3: #2A1836;
      --card: #0f0f14;
      --card-2: #15131b;
      --muted: #a9a9b2;
      --primary: #4f46e5;
      --primary-2: #7c3aed;
      --accent: #22d3ee; /* Голубой акцент */
      --good: #22c55e;
      --bad: #ef4444;
      --plus: #f59e0b;
      --btn: #2563eb;
      --btn-2: #1d4ed8;
      --shadow: 0 20px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,58,237,.25), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(79,70,229,.35), transparent 60%),
        radial-gradient(900px 600px at 110% 70%, rgba(34,211,238,.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 40%, var(--bg3));
      background-attachment: fixed;
    }

    .container { width: min(1120px, 92%); margin: 0 auto; padding: 20px 0; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(20,12,28,.85), rgba(20,12,28,.55));
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .brand {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0;
      font-weight: 800; font-size: 18px;
    }
    .section-title {
      font-size: clamp(26px, 4vw, 40px); font-weight: 800;
      margin: 26px 0 18px; text-align: center;
    }
    .cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px; margin-bottom: 40px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: transform 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); }
    .card h3 {
      font-size: 18px; margin: 0 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .card p {
      color: var(--muted); font-size: 14px; line-height: 1.5;
    }
    .card-author {
      font-size: 13px; color: var(--accent); margin-top: 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .buy-btn {
      background: linear-gradient(180deg, var(--accent), #0ea5e9);
      color: #000; font-weight: 800; border: none;
      padding: 10px 16px; border-radius: 12px;
      cursor: pointer; margin-top: 12px;
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; font-size: 15px;
      transition: filter 0.2s;
    }
    .buy-btn:hover { filter: brightness(1.1); }

    .admin-panel {
      background: rgba(10,10,20,0.7);
      border-radius: var(--radius-xl);
      padding: 24px; margin: 30px 0;
      border: 1px solid rgba(34,211,238,0.2);
    }
    .admin-form { display: grid; gap: 14px; margin-top: 16px; }
    .admin-form input, .admin-form textarea, .admin-form button {
      padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3); color: white; font-size: 15px;
    }
    .admin-form button {
      background: var(--accent); color: #000; font-weight: bold;
      cursor: pointer;
    }
    .login-form {
      background: var(--card);
      padding: 24px; border-radius: var(--radius-lg);
      max-width: 400px; margin: 40px auto;
      box-shadow: var(--shadow);
    }
    .hidden { display: none !important; }

    footer {
      text-align: center; padding: 30px 0; color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .nav-btn {
      background: rgba(34,211,238,0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="container">
      <div class="brand">
        <span>✨ Услуги & Новости</span>
        <button id="loginBtn" class="nav-btn">🔒 Войти как админ</button>
      </div>
    </div>
  </div>

  <main class="container">
    <h2 class="section-title">💼 Наши услуги</h2>
    <section class="cards" id="services"></section>

    <h2 class="section-title">📰 Объявления и новости</h2>
    <section class="cards" id="news"></section>
  </main>

  <!-- Форма входа -->
  <div id="loginModal" class="hidden">
    <div class="login-form">
      <h3 style="text-align:center">👑 Вход в админ-панель</h3>
      <input type="text" id="loginUser" placeholder="Логин (Admin)" />
      <input type="password" id="loginPass" placeholder="Пароль (admins123)" />
      <button id="doLogin">Войти</button>
      <p id="loginError" style="color:var(--bad); margin-top:8px; font-size:13px; text-align:center;"></p>
    </div>
  </div>

  <!-- Админ-панель -->
  <div id="adminPanel" class="admin-panel hidden">
    <h3>🛠️ Добавить услугу</h3>
    <div class="admin-form">
      <input type="text" id="serviceTitle" placeholder="Название услуги" />
      <textarea id="serviceDesc" placeholder="Описание услуги" rows="3"></textarea>
      <input type="text" id="serviceAuthor" placeholder="Автор (по умолчанию: Админ)" value="Админ" />
      <button id="addService">➕ Добавить услугу</button>
    </div>

    <h3 style="margin-top:30px">📣 Добавить новость/объявление</h3>
    <div class="admin-form">
      <input type="text" id="newsTitle" placeholder="Заголовок" />
      <textarea id="newsDesc" placeholder="Текст новости или объявления" rows="3"></textarea>
      <input type="text" id="newsAuthor" placeholder="Автор" value="Админ" />
      <button id="addNews">➕ Добавить новость</button>
    </div>

    <button id="logoutBtn" style="margin-top:20px; background: var(--bad); color:white;">🚪 Выйти</button>
  </div>

  <footer>
    &copy; 2025 | ✨ Услуги & Новости. Все права защищены.
  </footer>

  <script>
    // Данные (в реальном проекте — в БД, здесь — localStorage)
    let services = JSON.parse(localStorage.getItem('services') || '[]');
    let news = JSON.parse(localStorage.getItem('news') || '[]');
    let isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';

    const WA_LINK = 'https://wa.me/996999188001';

    // Рендер карточек
    function renderServices() {
      const container = document.getElementById('services');
      container.innerHTML = services.map((item, i) => `
        <div class="card">
          <h3>💼 ${item.title}</h3>
          <p>${item.description}</p>
          <div class="card-author">👤 ${item.author || 'Админ'}</div>
          <a href="${WA_LINK}" target="_blank" class="buy-btn">🛒 Купить</a>
        </div>
      `).join('');
    }

    function renderNews() {
      const container = document.getElementById('news');
      container.innerHTML = news.map(item => `
        <div class="card">
          <h3>📢 ${item.title}</h3>
          <p>${item.description}</p>
          <div class="card-author">👤 ${item.author || 'Админ'}</div>
        </div>
      `).join('');
    }

    // Сохранение
    function saveServices() {
      localStorage.setItem('services', JSON.stringify(services));
      renderServices();
    }
    function saveNews() {
      localStorage.setItem('news', JSON.stringify(news));
      renderNews();
    }

    // Показ/скрытие админки
    function toggleAdminPanel(show) {
      document.getElementById('adminPanel').classList.toggle('hidden', !show);
      document.getElementById('loginModal').classList.add('hidden');
      if (show) {
        localStorage.setItem('adminLoggedIn', 'true');
        isLoggedIn = true;
        document.getElementById('loginBtn').textContent = '🚪 Выйти';
      } else {
        localStorage.setItem('adminLoggedIn', 'false');
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = '🔒 Войти как админ';
      }
    }

    // Инициализация
    function init() {
      if (isLoggedIn) {
        toggleAdminPanel(true);
      }
      renderServices();
      renderNews();
    }

    // Обработчики
    document.getElementById('loginBtn').addEventListener('click', () => {
      if (isLoggedIn) {
        toggleAdminPanel(false);
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
      }
    });

    document.getElementById('doLogin').addEventListener('click', () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const error = document.getElementById('loginError');

      if (user === 'Admin' && pass === 'admins123') {
        error.textContent = '';
        toggleAdminPanel(true);
      } else {
        error.textContent = '❌ Неверный логин или пароль';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      toggleAdminPanel(false);
    });

    document.getElementById('addService').addEventListener('click', () => {
      const title = document.getElementById('serviceTitle').value.trim();
      const desc = document.getElementById('serviceDesc').value.trim();
      const author = document.getElementById('serviceAuthor').value.trim() || 'Админ';
      if (title && desc) {
        services.push({ title, description: desc, author });
        saveServices();
        document.getElementById('serviceTitle').value = '';
        document.getElementById('serviceDesc').value = '';
      }
    });

    document.getElementById('addNews').addEventListener('click', () => {
      const title = document.getElementById('newsTitle').value.trim();
      const desc = document.getElementById('newsDesc').value.trim();
      const author = document.getElementById('newsAuthor').value.trim() || 'Админ';
      if (title && desc) {
        news.push({ title, description: desc, author });
        saveNews();
        document.getElementById('newsTitle').value = '';
        document.getElementById('newsDesc').value = '';
      }
    });

    // Запуск
    init();
  </script>
</body>
</html>
