<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMM&ЦОМ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0A0F2C;
      --bg2: #0E153A;
      --bg3: #121B48;
      --card: #0f1428;
      --card-2: #151b30;
      --muted: #a9b1c6;
      --primary: #4f46e5;
      --accent: #22d3ee;
      --good: #22c55e;
      --snow: #e0f7ff;
      --like: #ff4d94;
      --delete: #ef4444;
      --email: #fbbf24;
      --shadow: 0 20px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,58,237,.25), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(79,70,229,.35), transparent 60%),
        radial-gradient(900px 600px at 110% 70%, rgba(34,211,238,.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 40%, var(--bg3));
      background-attachment: fixed;
      position: relative;
    }

    #snow {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .container {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 20px 0;
      position: relative;
      z-index: 2;
    }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(10,15,44,.9), rgba(10,15,44,.6));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 0 8px rgba(34,211,238,0.4);
    }

    .section-title {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      margin: 32px 0 20px;
      text-align: center;
      color: var(--snow);
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
      margin-bottom: 36px;
    }

    .card {
      background: linear-gradient(180deg, rgba(20,30,60,.6), rgba(15,20,40,.7));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
      transition: transform 0.2s ease;
      position: relative;
    }
    .card:hover { transform: translateY(-4px); }
    .card-img {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      background: #000;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card h3 {
      font-size: 17px;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .card-author, .card-email {
      font-size: 13px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-email { color: var(--email); }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .buy-btn, .like-btn, .delete-btn, .toggle-btn {
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .buy-btn { background: linear-gradient(180deg, var(--accent), #0ea5e9); color: #000; }
    .like-btn {
      background: rgba(255,77,148,0.15);
      color: var(--like);
      border: 1px solid rgba(255,77,148,0.3);
    }
    .like-btn.liked {
      background: rgba(255,77,148,0.3);
      color: white;
    }
    .delete-btn {
      background: rgba(239,68,68,0.15);
      color: var(--delete);
      border: 1px solid rgba(239,68,68,0.3);
      font-size: 12px;
    }
    .toggle-btn {
      background: rgba(34,211,238,0.15);
      color: var(--accent);
      border: 1px solid rgba(34,211,238,0.3);
      margin-top: 16px;
    }

    /* Модальное окно */
    #loginModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
    }
    #loginModal.active {
      opacity: 1;
      visibility: visible;
    }
    .login-form {
      background: var(--card);
      padding: 28px;
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.1);
    }
    .login-form h3 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .login-form input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(5,10,25,0.7);
      color: white;
      font-size: 16px;
    }
    .login-form input::placeholder {
      color: rgba(169,177,198,0.5);
    }
    .login-form button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: linear-gradient(135deg, var(--accent), #00bfff);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    #loginError {
      color: var(--delete);
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
    }

    .admin-panel {
      background: rgba(10,15,40,0.85);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin: 28px 0;
      box-shadow: var(--shadow);
    }
    .admin-form {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }
    .admin-form input, .admin-form textarea {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(5,10,25,0.7);
      color: white;
      font-size: 16px;
    }
    .admin-form button {
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00bfff);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .nav-btn {
      background: rgba(34,211,238,0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
    }
    .nav-btn:hover {
      background: var(--accent);
      color: #000;
    }

    footer {
      text-align: center;
      padding: 28px 0 40px;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.08);
      position: relative;
      z-index: 2;
      font-size: 15px;
    }

    /* Мобильные улучшения */
    @media (max-width: 600px) {
      .brand { font-size: 16px; padding: 12px 0; }
      .section-title { font-size: 24px; }
      .cards { grid-template-columns: 1fr; gap: 20px; }
      .card { padding: 16px; }
      .card-img { height: 140px; }
      .buy-btn, .like-btn, .delete-btn {
        padding: 10px 14px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <canvas id="snow"></canvas>

  <div class="topbar">
    <div class="container">
      <div class="brand">
        <span>❄️ SMM&ЦОМ</span>
        <button id="loginBtn" class="nav-btn">🔒 Админка</button>
      </div>
    </div>
  </div>

  <main class="container">
    <h2 class="section-title">💼 Услуги</h2>
    <section class="cards" id="services"></section>

    <h2 class="section-title">📰 Новости и объявления</h2>
    <section class="cards" id="news"></section>

    <h2 class="section-title">👥 Состав ЦОМ</h2>
    <section class="cards" id="team"></section>

    <h2 class="section-title">✉️ Контакты / Почты</h2>
    <section class="cards" id="emails"></section>
  </main>

  <!-- Модальное окно входа -->
  <div id="loginModal">
    <div class="login-form">
      <h3>👑 Вход в админ-панель</h3>
      <input type="text" id="loginUser" autocomplete="off" />
      <input type="password" id="loginPass" autocomplete="off" />
      <button id="doLogin">Войти</button>
      <p id="loginError"></p>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel" style="display: none;">
    <h3>➕ Добавить услугу</h3>
    <div class="admin-form">
      <input type="text" id="serviceTitle" placeholder="Название услуги" />
      <input type="text" id="servicePhoto" placeholder="URL фото (https://...)" />
      <textarea id="serviceDesc" placeholder="Описание" rows="3"></textarea>
      <input type="text" id="serviceAuthor" placeholder="Автор" value="Админ" />
      <button id="addService">Добавить</button>
    </div>

    <h3 style="margin-top:28px">📣 Добавить новость</h3>
    <div class="admin-form">
      <input type="text" id="newsTitle" placeholder="Заголовок" />
      <input type="text" id="newsPhoto" placeholder="URL фото" />
      <textarea id="newsDesc" placeholder="Текст" rows="3"></textarea>
      <input type="text" id="newsAuthor" placeholder="Автор" value="Админ" />
      <button id="addNews">Добавить</button>
    </div>

    <h3 style="margin-top:28px">👥 Добавить в состав ЦОМ</h3>
    <div class="admin-form">
      <input type="text" id="teamName" placeholder="ФИО" />
      <input type="text" id="teamPhoto" placeholder="URL фото" />
      <input type="text" id="teamRole" placeholder="Должность" />
      <textarea id="teamDesc" placeholder="Описание" rows="3"></textarea>
      <button id="addTeam">Добавить</button>
    </div>

    <h3 style="margin-top:28px">✉️ Добавить email</h3>
    <div class="admin-form">
      <input type="text" id="emailName" placeholder="ФИО" />
      <input type="text" id="emailRole" placeholder="Должность" />
      <input type="email" id="emailAddress" placeholder="Email" />
      <button id="addEmail">Добавить email</button>
    </div>

    <button id="toggleSnow" class="toggle-btn" style="margin-top:20px; width:100%;">❄️ Включить/Выключить снег</button>
    <button id="logoutBtn" style="margin-top:16px; background: #ef4444; color:white; padding:14px; border-radius:12px; font-weight:bold; width:100%;">🚪 Выйти</button>
  </div>

  <footer>
    👁️ Посетили: <span id="visitCount">0</span> раз<br>
    &copy; 2025 SMM&ЦОМ ❄️ Все права защищены.
  </footer>

  <script>
    // === ДАННЫЕ ===
    let services = JSON.parse(localStorage.getItem('services') || '[]');
    let news = JSON.parse(localStorage.getItem('news') || '[]');
    let team = JSON.parse(localStorage.getItem('team') || '[]');
    let emails = JSON.parse(localStorage.getItem('emails') || '[]');
    let likes = JSON.parse(localStorage.getItem('likes') || '{}');
    let visitCount = parseInt(localStorage.getItem('visitCount') || '0');
    let snowEnabled = localStorage.getItem('snowEnabled') !== 'false';
    let isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';

    const WA_LINK = 'https://wa.me/996999188001';

    // === СЧЁТЧИК ПОСЕЩЕНИЙ ===
    if (!sessionStorage.getItem('visited')) {
      visitCount++;
      localStorage.setItem('visitCount', visitCount.toString());
      sessionStorage.setItem('visited', 'true');
    }
    document.getElementById('visitCount').textContent = visitCount.toLocaleString();

    // === УПРАВЛЕНИЕ СНЕГОМ ===
    function setSnow(enabled) {
      snowEnabled = enabled;
      localStorage.setItem('snowEnabled', snowEnabled.toString());
      const snowCanvas = document.getElementById('snow');
      snowCanvas.style.display = enabled ? 'block' : 'none';
      if (enabled) initSnowAnimation();
    }

    function initSnowAnimation() {
      const canvas = document.getElementById('snow');
      if (!snowEnabled || canvas.style.display === 'none') return;

      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const flakes = [];
      const flakeCount = window.innerWidth > 768 ? 150 : 80;

      class Flake {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * -canvas.height;
          this.size = Math.random() * 3 + 1;
          this.speed = Math.random() * 2.5 + 0.5;
          this.wind = Math.random() * 1.5 - 0.75;
        }
        update() {
          this.y += this.speed;
          this.x += this.wind;
          if (this.y > canvas.height) {
            this.y = -10;
            this.x = Math.random() * canvas.width;
          }
        }
        draw() {
          ctx.fillStyle = 'rgba(224, 247, 255, 0.85)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < flakeCount; i++) {
        flakes.push(new Flake());
      }

      function animate() {
        if (!snowEnabled) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        flakes.forEach(flake => {
          flake.update();
          flake.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        if (snowEnabled) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
      });
    }

    // === РЕНДЕР ===
    function renderAll() {
      renderServices();
      renderNews();
      renderTeam();
      renderEmails();
    }

    function renderServices() {
      const container = document.getElementById('services');
      container.innerHTML = services.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3>💼 ${item.title}</h3>
          <p>${item.description}</p>
          <div class="card-author">👤 ${item.author || 'Админ'}</div>
          <div class="card-actions">
            <a href="${WA_LINK}" target="_blank" class="buy-btn">🛒 Купить</a>
            ${isLoggedIn ? `<button class="delete-btn" data-type="service" data-index="${i}">🗑️ Удалить</button>` : ''}
          </div>
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function renderNews() {
      const container = document.getElementById('news');
      container.innerHTML = news.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3>📢 ${item.title}</h3>
          <p>${item.description}</p>
          <div class="card-author">👤 ${item.author || 'Админ'}</div>
          <div class="card-actions">
            <button class="like-btn ${likes[`news-${i}`] ? 'liked' : ''}" data-type="news" data-index="${i}">
              ${likes[`news-${i}`] ? '❤️' : '🤍'} Лайк (${item.likes || 0})
            </button>
            ${isLoggedIn ? `<button class="delete-btn" data-type="news" data-index="${i}">🗑️ Удалить</button>` : ''}
          </div>
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
      attachLikeListeners();
    }

    function renderTeam() {
      const container = document.getElementById('team');
      container.innerHTML = team.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3>👤 ${item.name}</h3>
          <p><strong>${item.role}</strong></p>
          <p>${item.description}</p>
          ${isLoggedIn ? `<div style="margin-top:12px;"><button class="delete-btn" data-type="team" data-index="${i}">🗑️ Удалить</button></div>` : ''}
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function renderEmails() {
      const container = document.getElementById('emails');
      container.innerHTML = emails.map((item, i) => `
        <div class="card">
          <h3>✉️ ${item.name}</h3>
          <p><strong>${item.role}</strong></p>
          <div class="card-email">📧 ${item.email}</div>
          ${isLoggedIn ? `<div style="margin-top:12px;"><button class="delete-btn" data-type="email" data-index="${i}">🗑️ Удалить</button></div>` : ''}
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function saveData() {
      localStorage.setItem('services', JSON.stringify(services));
      localStorage.setItem('news', JSON.stringify(news));
      localStorage.setItem('team', JSON.stringify(team));
      localStorage.setItem('emails', JSON.stringify(emails));
      localStorage.setItem('likes', JSON.stringify(likes));
      renderAll();
    }

    function toggleAdminPanel(show) {
      const panel = document.getElementById('adminPanel');
      panel.style.display = show ? 'block' : 'none';
      if (show) {
        localStorage.setItem('adminLoggedIn', 'true');
        isLoggedIn = true;
        document.getElementById('loginBtn').textContent = '🚪 Выйти';
      } else {
        localStorage.setItem('adminLoggedIn', 'false');
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = '🔒 Админка';
      }
      renderAll();
    }

    function attachDeleteListeners() {
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const index = parseInt(btn.dataset.index);
          if (confirm('Точно удалить?')) {
            if (type === 'service') services.splice(index, 1);
            else if (type === 'news') news.splice(index, 1);
            else if (type === 'team') team.splice(index, 1);
            else if (type === 'email') emails.splice(index, 1);
            saveData();
          }
        };
      });
    }

    function attachLikeListeners() {
      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const index = parseInt(btn.dataset.index);
          const key = `${type}-${index}`;
          if (likes[key]) return;
          likes[key] = true;
          if (!news[index].likes) news[index].likes = 0;
          news[index].likes += 1;
          saveData();
        };
      });
    }

    // === ИНИЦИАЛИЗАЦИЯ ===
    function init() {
      setSnow(snowEnabled);
      if (isLoggedIn) {
        toggleAdminPanel(true);
      }
      renderAll();
    }

    // === ОБРАБОТЧИКИ ===
    document.getElementById('loginBtn').addEventListener('click', () => {
      if (isLoggedIn) {
        toggleAdminPanel(false);
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    });

    document.getElementById('doLogin').addEventListener('click', () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const error = document.getElementById('loginError');

      if (user === 'Admin' && pass === 'admins123') {
        error.textContent = '';
        document.getElementById('loginModal').classList.remove('active');
        toggleAdminPanel(true);
      } else {
        error.textContent = '❌ Неверный логин или пароль';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      toggleAdminPanel(false);
    });

    document.getElementById('toggleSnow').addEventListener('click', () => {
      setSnow(!snowEnabled);
    });

    // Закрытие модалки при клике вне формы
    document.getElementById('loginModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('loginModal')) {
        document.getElementById('loginModal').classList.remove('active');
      }
    });

    // === ДОБАВЛЕНИЕ ===
    ['addService', 'addNews', 'addTeam', 'addEmail'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        const prefix = id.replace('add', '').toLowerCase();
        let valid = true;
        const data = {};
        document.querySelectorAll(`#${id} ~ .admin-form input, #${id} ~ .admin-form textarea`).forEach(inp => {
          if (inp.hasAttribute('required') || inp.value.trim()) {
            data[inp.id] = inp.value.trim();
          }
        });

        if (id === 'addService') {
          if (!data.serviceTitle || !data.serviceDesc) valid = false;
          else services.push({
            title: data.serviceTitle,
            photo: data.servicePhoto || '',
            description: data.serviceDesc,
            author: data.serviceAuthor || 'Админ'
          });
        } else if (id === 'addNews') {
          if (!data.newsTitle || !data.newsDesc) valid = false;
          else news.push({
            title: data.newsTitle,
            photo: data.newsPhoto || '',
            description: data.newsDesc,
            author: data.newsAuthor || 'Админ',
            likes: 0
          });
        } else if (id === 'addTeam') {
          if (!data.teamName || !data.teamRole || !data.teamDesc) valid = false;
          else team.push({
            name: data.teamName,
            photo: data.teamPhoto || '',
            role: data.teamRole,
            description: data.teamDesc
          });
        } else if (id === 'addEmail') {
          if (!data.emailName || !data.emailRole || !data.emailAddress) valid = false;
          else emails.push({
            name: data.emailName,
            role: data.emailRole,
            email: data.emailAddress
          });
        }

        if (valid) {
          saveData();
          // Очистка полей
          document.querySelectorAll(`#${id} ~ .admin-form input, #${id} ~ .admin-form textarea`).forEach(inp => inp.value = '');
        }
      });
    });

    init();
  </script>
</body>
</html>
