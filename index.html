<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMM&ЦОМ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0A0F2C;
      --bg2: #0E153A;
      --bg3: #121B48;
      --card: #0f1428;
      --muted: #a9b1c6;
      --accent: #22d3ee;
      --like: #ff4d94;
      --delete: #ef4444;
      --email: #fbbf24;
      --shadow: 0 20px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
      --radius-lg: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,58,237,.25), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(79,70,229,.35), transparent 60%),
        radial-gradient(900px 600px at 110% 70%, rgba(34,211,238,.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 40%, var(--bg3));
      background-attachment: fixed;
      position: relative;
    }

    #snow {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .container {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 20px 0;
      position: relative;
      z-index: 2;
    }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(10,15,44,.9), rgba(10,15,44,.6));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-weight: 800;
      font-size: 18px;
    }

    .section-title {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      margin: 32px 0 20px;
      text-align: center;
      color: #e0f7ff;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
      margin-bottom: 36px;
    }

    .card {
      background: rgba(15,20,40,0.7);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card-img {
      width: 100%; height: 150px; border-radius: 12px; overflow: hidden; margin-bottom: 14px;
      background: #000;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }

    .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn {
      padding: 8px 12px; border-radius: 10px; font-weight: bold; font-size: 14px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap; border: none;
    }
    .btn-buy { background: linear-gradient(180deg, var(--accent), #0ea5e9); color: #000; }
    .btn-like {
      background: rgba(255,77,148,0.15); color: var(--like); border: 1px solid rgba(255,77,148,0.3);
    }
    .btn-like.liked { background: rgba(255,77,148,0.3); color: white; }
    .btn-delete {
      background: rgba(239,68,68,0.15); color: var(--delete); border: 1px solid rgba(239,68,68,0.3);
      font-size: 12px;
    }

    /* Модальное окно входа */
    #loginModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .login-form {
      background: #0f1428; padding: 28px; border-radius: 18px;
      width: 90%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .login-form input {
      width: 100%; padding: 14px; margin: 8px 0;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(5,10,25,0.7);
      color: white; font-size: 16px;
    }
    .login-form button {
      width: 100%; padding: 14px; margin-top: 12px;
      background: linear-gradient(135deg, var(--accent), #00bfff);
      color: #000; font-weight: bold; border: none; border-radius: 12px; font-size: 16px;
    }

    /* Админ-панель */
    #adminPanel {
      background: rgba(10,15,40,0.85);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 26px;
      padding: 24px;
      margin: 28px 0;
      box-shadow: var(--shadow);
      display: none;
    }
    .admin-form {
      display: grid; gap: 14px; margin-top: 16px;
    }
    .admin-form input, .admin-form textarea {
      padding: 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(5,10,25,0.7);
      color: white; font-size: 16px;
    }
    .admin-form button {
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00bfff);
      color: #000; font-weight: bold; border: none; border-radius: 12px; font-size: 16px;
    }

    .nav-btn {
      background: rgba(34,211,238,0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
    }

    footer {
      text-align: center; padding: 28px 0 40px; color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 15px;
    }

    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .card-img { height: 140px; }
    }
  </style>
</head>
<body>

  <canvas id="snow"></canvas>

  <div class="topbar">
    <div class="container">
      <div class="brand">
        <span>❄️ SMM&ЦОМ</span>
        <button id="loginBtn" class="nav-btn">🔒 Админка</button>
      </div>
    </div>
  </div>

  <main class="container">
    <h2 class="section-title">💼 Услуги</h2>
    <section class="cards" id="services"></section>

    <h2 class="section-title">📰 Новости и объявления</h2>
    <section class="cards" id="news"></section>

    <h2 class="section-title">👥 Состав ЦОМ</h2>
    <section class="cards" id="team"></section>

    <h2 class="section-title">✉️ Контакты / Почты</h2>
    <section class="cards" id="emails"></section>
  </main>

  <!-- Модальное окно входа -->
  <div id="loginModal">
    <div class="login-form">
      <h3 style="text-align:center; margin-bottom:20px; color:#fff;">👑 Вход в админ-панель</h3>
      <input type="text" id="loginUser" placeholder="Логин" />
      <input type="password" id="loginPass" placeholder="Пароль" />
      <button id="doLogin">Войти</button>
      <p id="loginError" style="color:#ef4444; text-align:center; margin-top:10px; font-size:14px;"></p>
    </div>
  </div>

  <!-- Админ-панель -->
  <div id="adminPanel"></div>

  <footer>
    👁️ Посетили: <span id="visitCount">0</span> раз<br>
    &copy; 2025 SMM&ЦОМ ❄️ Все права защищены.
  </footer>

  <script>
    // === ИНИЦИАЛИЗАЦИЯ ДАННЫХ ===
    let services = JSON.parse(localStorage.getItem('services') || '[]');
    let news = JSON.parse(localStorage.getItem('news') || '[]');
    let team = JSON.parse(localStorage.getItem('team') || '[]');
    let emails = JSON.parse(localStorage.getItem('emails') || '[]');
    let likes = JSON.parse(localStorage.getItem('likes') || '{}');
    let visitCount = parseInt(localStorage.getItem('visitCount') || '0');
    let snowEnabled = localStorage.getItem('snowEnabled') !== 'false';
    let isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';

    const WA_LINK = 'https://wa.me/996999188001';

    // Посещения
    if (!sessionStorage.getItem('visited')) {
      visitCount++;
      localStorage.setItem('visitCount', visitCount.toString());
      sessionStorage.setItem('visited', 'true');
    }
    document.getElementById('visitCount').textContent = visitCount.toLocaleString();

    // === СНЕГ ===
    function initSnow() {
      const canvas = document.getElementById('snow');
      if (!snowEnabled) {
        canvas.style.display = 'none';
        return;
      }
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const flakes = [];
      const count = window.innerWidth > 768 ? 120 : 60;

      class Flake {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * -canvas.height;
          this.size = Math.random() * 3 + 1;
          this.speed = Math.random() * 2 + 0.5;
          this.wind = Math.random() * 1.2 - 0.6;
        }
        update() {
          this.y += this.speed;
          this.x += this.wind;
          if (this.y > canvas.height) {
            this.y = -10;
            this.x = Math.random() * canvas.width;
          }
        }
        draw() {
          ctx.fillStyle = 'rgba(224, 247, 255, 0.85)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < count; i++) flakes.push(new Flake());

      function animate() {
        if (!snowEnabled) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        flakes.forEach(f => { f.update(); f.draw(); });
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        if (snowEnabled) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
      });
    }

    // === РЕНДЕР ===
    function renderAll() {
      renderServices();
      renderNews();
      renderTeam();
      renderEmails();
    }

    function renderServices() {
      const el = document.getElementById('services');
      el.innerHTML = services.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3 style="font-size:17px;margin:0 0 8px;">💼 ${item.title}</h3>
          <p style="color:#a9b1c6;font-size:14px;line-height:1.4;">${item.description}</p>
          <div style="font-size:13px;margin-top:10px;color:#22d3ee;">👤 ${item.author || 'Админ'}</div>
          <div class="card-actions">
            <a href="${WA_LINK}" target="_blank" class="btn btn-buy">🛒 Купить</a>
            ${isLoggedIn ? `<button class="btn btn-delete" data-type="service" data-index="${i}">🗑️ Удалить</button>` : ''}
          </div>
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function renderNews() {
      const el = document.getElementById('news');
      el.innerHTML = news.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3 style="font-size:17px;margin:0 0 8px;">📢 ${item.title}</h3>
          <p style="color:#a9b1c6;font-size:14px;line-height:1.4;">${item.description}</p>
          <div style="font-size:13px;margin-top:10px;color:#22d3ee;">👤 ${item.author || 'Админ'}</div>
          <div class="card-actions">
            <button class="btn btn-like ${likes[`news-${i}`] ? 'liked' : ''}" data-type="news" data-index="${i}">
              ${likes[`news-${i}`] ? '❤️' : '🤍'} Лайк (${item.likes || 0})
            </button>
            ${isLoggedIn ? `<button class="btn btn-delete" data-type="news" data-index="${i}">🗑️ Удалить</button>` : ''}
          </div>
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
      attachLikeListeners();
    }

    function renderTeam() {
      const el = document.getElementById('team');
      el.innerHTML = team.map((item, i) => `
        <div class="card">
          ${item.photo ? `<div class="card-img"><img src="${item.photo}" alt="Фото"></div>` : ''}
          <h3 style="font-size:17px;margin:0 0 8px;">👤 ${item.name}</h3>
          <p style="font-weight:bold;color:#22d3ee;">${item.role}</p>
          <p style="color:#a9b1c6;font-size:14px;">${item.description}</p>
          ${isLoggedIn ? `<div style="margin-top:12px;"><button class="btn btn-delete" data-type="team" data-index="${i}">🗑️ Удалить</button></div>` : ''}
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function renderEmails() {
      const el = document.getElementById('emails');
      el.innerHTML = emails.map((item, i) => `
        <div class="card">
          <h3 style="font-size:17px;margin:0 0 8px;">✉️ ${item.name}</h3>
          <p style="font-weight:bold;color:#fbbf24;">${item.role}</p>
          <p style="color:#a9b1c6;font-size:14px;">📧 ${item.email}</p>
          ${isLoggedIn ? `<div style="margin-top:12px;"><button class="btn btn-delete" data-type="email" data-index="${i}">🗑️ Удалить</button></div>` : ''}
        </div>
      `).join('');
      if (isLoggedIn) attachDeleteListeners();
    }

    function saveAll() {
      localStorage.setItem('services', JSON.stringify(services));
      localStorage.setItem('news', JSON.stringify(news));
      localStorage.setItem('team', JSON.stringify(team));
      localStorage.setItem('emails', JSON.stringify(emails));
      localStorage.setItem('likes', JSON.stringify(likes));
      renderAll();
    }

    function toggleAdminPanel(show) {
      document.getElementById('adminPanel').style.display = show ? 'block' : 'none';
      document.getElementById('loginBtn').textContent = show ? '🚪 Выйти' : '🔒 Админка';
      localStorage.setItem('adminLoggedIn', String(show));
      isLoggedIn = show;
      if (show) renderAdminPanel();
      renderAll();
    }

    function renderAdminPanel() {
      document.getElementById('adminPanel').innerHTML = `
        <h3 style="color:#fff;font-weight:800;margin:0 0 16px;">➕ Добавить услугу</h3>
        <div class="admin-form">
          <input type="text" id="serviceTitle" placeholder="Название услуги" />
          <input type="text" id="servicePhoto" placeholder="URL фото (https://...)" />
          <textarea id="serviceDesc" placeholder="Описание" rows="3"></textarea>
          <input type="text" id="serviceAuthor" placeholder="Автор" value="Админ" />
          <button id="addService">Добавить</button>
        </div>

        <h3 style="color:#fff;font-weight:800;margin:28px 0 16px;">📣 Добавить новость</h3>
        <div class="admin-form">
          <input type="text" id="newsTitle" placeholder="Заголовок" />
          <input type="text" id="newsPhoto" placeholder="URL фото" />
          <textarea id="newsDesc" placeholder="Текст" rows="3"></textarea>
          <input type="text" id="newsAuthor" placeholder="Автор" value="Админ" />
          <button id="addNews">Добавить</button>
        </div>

        <h3 style="color:#fff;font-weight:800;margin:28px 0 16px;">👥 Добавить в состав ЦОМ</h3>
        <div class="admin-form">
          <input type="text" id="teamName" placeholder="ФИО" />
          <input type="text" id="teamPhoto" placeholder="URL фото" />
          <input type="text" id="teamRole" placeholder="Должность" />
          <textarea id="teamDesc" placeholder="Описание" rows="3"></textarea>
          <button id="addTeam">Добавить</button>
        </div>

        <h3 style="color:#fff;font-weight:800;margin:28px 0 16px;">✉️ Добавить email</h3>
        <div class="admin-form">
          <input type="text" id="emailName" placeholder="ФИО" />
          <input type="text" id="emailRole" placeholder="Должность" />
          <input type="email" id="emailAddress" placeholder="Email" />
          <button id="addEmail">Добавить email</button>
        </div>

        <button id="toggleSnow" class="btn" style="background:rgba(34,211,238,0.2);color:#22d3ee;border:1px solid #22d3ee;margin-top:20px;width:100%;">
          ❄️ ${snowEnabled ? 'Выключить' : 'Включить'} снег
        </button>
        <button id="logoutBtn" class="btn" style="background:#ef4444;color:white;margin-top:12px;width:100%;">
          🚪 Выйти
        </button>
      `;

      // Назначаем обработчики после рендеринга
      document.getElementById('addService').onclick = addService;
      document.getElementById('addNews').onclick = addNews;
      document.getElementById('addTeam').onclick = addTeam;
      document.getElementById('addEmail').onclick = addEmail;
      document.getElementById('toggleSnow').onclick = () => {
        snowEnabled = !snowEnabled;
        localStorage.setItem('snowEnabled', snowEnabled);
        initSnow();
        renderAdminPanel(); // обновить текст кнопки
      };
      document.getElementById('logoutBtn').onclick = () => toggleAdminPanel(false);
    }

    function attachDeleteListeners() {
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const index = parseInt(btn.dataset.index);
          if (confirm('Удалить?')) {
            if (type === 'service') services.splice(index, 1);
            else if (type === 'news') news.splice(index, 1);
            else if (type === 'team') team.splice(index, 1);
            else if (type === 'email') emails.splice(index, 1);
            saveAll();
          }
        };
      });
    }

    function attachLikeListeners() {
      document.querySelectorAll('.btn-like').forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const index = parseInt(btn.dataset.index);
          const key = `${type}-${index}`;
          if (likes[key]) return;
          likes[key] = true;
          if (!news[index].likes) news[index].likes = 0;
          news[index].likes++;
          saveAll();
        };
      });
    }

    // === ДОБАВЛЕНИЕ ===
    function addService() {
      const title = document.getElementById('serviceTitle').value.trim();
      const photo = document.getElementById('servicePhoto').value.trim();
      const desc = document.getElementById('serviceDesc').value.trim();
      const author = document.getElementById('serviceAuthor').value.trim() || 'Админ';
      if (title && desc) {
        services.push({ title, photo, description: desc, author });
        saveAll();
        document.getElementById('serviceTitle').value = '';
        document.getElementById('servicePhoto').value = '';
        document.getElementById('serviceDesc').value = '';
      } else alert('Заполните название и описание');
    }

    function addNews() {
      const title = document.getElementById('newsTitle').value.trim();
      const photo = document.getElementById('newsPhoto').value.trim();
      const desc = document.getElementById('newsDesc').value.trim();
      const author = document.getElementById('newsAuthor').value.trim() || 'Админ';
      if (title && desc) {
        news.push({ title, photo, description: desc, author, likes: 0 });
        saveAll();
        document.getElementById('newsTitle').value = '';
        document.getElementById('newsPhoto').value = '';
        document.getElementById('newsDesc').value = '';
      } else alert('Заполните заголовок и текст');
    }

    function addTeam() {
      const name = document.getElementById('teamName').value.trim();
      const photo = document.getElementById('teamPhoto').value.trim();
      const role = document.getElementById('teamRole').value.trim();
      const desc = document.getElementById('teamDesc').value.trim();
      if (name && role && desc) {
        team.push({ name, photo, role, description: desc });
        saveAll();
        document.getElementById('teamName').value = '';
        document.getElementById('teamPhoto').value = '';
        document.getElementById('teamRole').value = '';
        document.getElementById('teamDesc').value = '';
      } else alert('Заполните все поля');
    }

    function addEmail() {
      const name = document.getElementById('emailName').value.trim();
      const role = document.getElementById('emailRole').value.trim();
      const email = document.getElementById('emailAddress').value.trim();
      if (name && role && email) {
        emails.push({ name, role, email });
        saveAll();
        document.getElementById('emailName').value = '';
        document.getElementById('emailRole').value = '';
        document.getElementById('emailAddress').value = '';
      } else alert('Заполните все поля');
    }

    // === ВХОД ===
    document.getElementById('loginBtn').onclick = () => {
      if (isLoggedIn) {
        toggleAdminPanel(false);
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    };

    document.getElementById('doLogin').onclick = () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (user === 'Admin' && pass === 'admins123') {
        document.getElementById('loginModal').style.display = 'none';
        toggleAdminPanel(true);
      } else {
        document.getElementById('loginError').textContent = '❌ Неверный логин или пароль';
      }
    };

    // Закрытие модалки по клику вне
    document.getElementById('loginModal').onclick = (e) => {
      if (e.target === document.getElementById('loginModal')) {
        document.getElementById('loginModal').style.display = 'none';
      }
    };

    // === ЗАПУСК ===
    initSnow();
    renderAll();
    if (isLoggedIn) {
      toggleAdminPanel(true);
    }
  </script>
</body>
</html>
